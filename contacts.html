<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти — Памʼять назавжди</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="logo" onclick="window.location.href='index.html'">
          <h1>Магазин</h1>
        </div>

        <div class="header-right">
          <button id="toggle-form" class="scroll-btn" aria-label="Зв'язатися">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.05-.24 11.72 11.72 0 0 0 3.68.59 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.25a1 1 0 0 1 1 1 11.72 11.72 0 0 0 .59 3.68 1 1 0 0 1-.24 1.05l-2.2 2.2z"
              />
            </svg>
          </button>

          <div class="menu-wrapper">
            <div id="hamburger-btn" role="button" tabindex="0">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>

            <div id="menu-popup">
              <ul>
                <li><a href="catalog.html">Каталог пам'ятників</a></li>
                <li><a href="exhibition.html">Виставка</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="contacts.html">Контакти</a></li>
              </ul>
            </div>
          </div>
        </div>
      </header>

      <!-- Заголовок -->
      <div class="full-width-header-wrapper scroll-animate">
        <div class="full-width-header">Контакти</div>
        <div class="underline"></div>
      </div>

      <!-- Карта -->
      <main>
        <section
          class="map-section scroll-animate"
          style="padding: 40px 20px; text-align: center"
        >
          <section id="map" style="margin: 40px 0">
            <div class="map-container">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1298.0288405565564!2d28.606807004438373!3d50.957515828695!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x472bdbbc7ee4a571%3A0x253906e14a821879!2z0LLRg9C70LjRhtGPINCG0LLQsNC90LAg0JrQvtGC0LvRj9GA0LXQstGB0YzQutC-0LPQviwgMTQ0LCDQmtC-0YDQvtGB0YLQtdC90YwsINCW0LjRgtC-0LzQuNGA0YHRjNC60LAg0L7QsdC70LDRgdGC0YwsIDExNTA5!5e0!3m2!1suk!2sua!4v1755598409190!5m2!1suk!2sua"
                width="600"
                height="450"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
          </section>
        </section>
      </main>

      <!-- Footer -->
      <footer>
        <div class="footer-container">
          <div class="footer-left">
            <h3>Магазин</h3>
            <address>
              м. Київ, вул. Пам’яті, 10<br />
              <a
                href="tel:+380961234567"
                id="phone-link"
                class="phone-link-modal"
                >+38 (096) 123 45 67</a
              ><br />
              Email: info@pamjatka.ua
            </address>
          </div>

          <div class="footer-right">
            <h3>Залишити заявку</h3>
            <br />
            <form id="footer-contact-form">
              <input type="text" name="name" placeholder="Ім'я" required />
              <input
                type="tel"
                name="phone"
                placeholder="Номер телефону"
                required
              />
              <textarea name="message" placeholder="Повідомлення"></textarea>
              <button type="submit" id="submit-button">Відправити</button>
            </form>
          </div>
        </div>

        <p class="footer-bottom-text">© 2025 Памʼять. Всі права захищено.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
